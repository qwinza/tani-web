# nginx.conf - Konfigurasi Reverse Proxy Nginx & TLS (Hardened)
# Tempatkan konfigurasi ini di /etc/nginx/sites-available/website-uas.local

server {
    listen 80;
    server_name website-uas.local;
    
    # Force HTTP to HTTPS redirection
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name website-uas.local;

    # TLS Configuration (Hanya mengizinkan TLS v1.2 dan TLS v1.3 yang aman)
    ssl_certificate /etc/ssl/certs/uas_server.crt;
    ssl_certificate_key /etc/ssl/private/uas_server.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

    # SSL Session settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Security Headers (Anti-XSS, Anti-Clickjacking, Anti-Sniffing)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Root directory path of public Laravel
    root /var/www/bertani/public;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/website-uas_access.log;
    error_log /var/log/nginx/website-uas_error.log;

    # Main application location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI server
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Sesuaikan dengan versi PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # LOCKDOWN: Mencegah eksekusi file script di direktori upload (/storage/products)
    location ~* ^/storage/products/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ /\.(ht|git|env) {
        deny all;
    }
}
