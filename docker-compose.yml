# docker-compose.yml - Container Security & Resource Constraints
version: '3.8'

services:
  # App Service (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrimatch-app:secure
    container_name: agrimatch_sec_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    # Batasan Resource Container (Mencegah serangan DoS dari kebocoran resource container)
    deploy:
      resources:
        limits:
          cpus: '0.50'          # Membatasi maksimal 50% CPU Core
          memory: 512M          # Membatasi maksimal 512MB RAM
    # Pengerasan Kapabilitas Linux
    cap_drop:
      - ALL                    # Drop semua kapabilitas kernel secara default
    cap_add:
      - CHOWN                  # Hanya izinkan CHOWN dasar jika diperlukan
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true # Mencegah eskalasi hak akses (privilege escalation)
    networks:
      - secure-network

  # Web Server Service (Nginx)
  webserver:
    image: nginx:alpine-slim
    container_name: agrimatch_sec_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./security-infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE       # Dibutuhkan untuk membind port 80/443
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    networks:
      - secure-network

networks:
  secure-network:
    driver: bridge
